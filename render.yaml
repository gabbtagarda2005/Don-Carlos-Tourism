# Render Blueprint — deploys the backend API.
# Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: don-carlos-tourism-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string when prompted
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        sync: false # e.g. https://your-site.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "true"
